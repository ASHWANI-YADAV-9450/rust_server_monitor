[package]
name = "rust-server-monitor"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["full"] }
sysinfo = "0.35"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json"] }
chrono = { version = "0.4", features = ["serde"] }
axum = "0.8"
tracing = "0.1"
tracing-subscriber = "0.3"